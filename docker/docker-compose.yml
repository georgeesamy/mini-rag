services:
  mongodb:
    image: mongo:7.0.34-jammy

    container_name: mongodb

    ports:
      - "27007:27017"

    volumes:
      - mongodata:/data/db

    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME} #we use this format to access info from .env file because they are confidential 
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD} 

    networks:
      - backend

    restart: always

networks:
  backend:

volumes:
  mongodata:  #to attach it to /data/db
 